/** keys.local.json as a Java string literal, or an empty list when the file is missing (see keys.local.example.json). */
def localKeysJson() {
    def file = rootProject.file('keys.local.json')
    def json = file.exists() ? groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file)) : '[]'
    return '"' + json.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.tap.company.checkout_android'
    compileSdk 36

    defaultConfig {
        applicationId "com.tap.company.checkout_android"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Each instrumented test runs in a fresh app process with cleared data, like a relaunch on iOS.
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        debug {
            // Your own sandbox keys from keys.local.json at the repo root (gitignored), offered in Settings > Saved Keys.
            buildConfigField "String", "LOCAL_KEYS_JSON", localKeysJson()
        }
        release {
            buildConfigField "String", "LOCAL_KEYS_JSON", '"[]"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose false
        buildConfig true
    }

}

